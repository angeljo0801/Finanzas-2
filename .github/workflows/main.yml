name: Compilar APK Finanzas Definitiva 2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir aplicación
        run: unzip -o Finanzas_Definitiva_Flutter_v2.zip

      - name: Añadir eliminación segura
        run: python3 apply_delete_support.py

      - name: Aplicar mejora de deudas y abonos parciales
        run: cp overrides/lib/database.dart overrides/lib/manager_pages.dart finanzas_definitiva/lib/ && cp overrides/pubspec.yaml finanzas_definitiva/pubspec.yaml

      - name: Inspeccionar código del asistente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = ['Asistente financiero','Soy tu asistente financiero','Revisar y crear asiento','¿Cómo creo un asiento?','llama','ollama','prompt']
          for p in Path('finanzas_definitiva/lib').rglob('*.dart'):
              s = p.read_text(encoding='utf-8', errors='ignore')
              if any(n.lower() in s.lower() for n in needles):
                  print(f'===== FILE: {p} =====')
                  lines = s.splitlines()
                  hits = [i for i,l in enumerate(lines) if any(n.lower() in l.lower() for n in needles)]
                  shown=set()
                  for i in hits:
                      a=max(0,i-45); b=min(len(lines),i+90)
                      for j in range(a,b):
                          if j not in shown:
                              print(f'{j+1:04d}: {lines[j]}')
                              shown.add(j)
                  print('===== END FILE =====')
          PY

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar proyecto Android
        working-directory: finanzas_definitiva
        run: flutter create . --platforms=android --org com.angel.finanzas.nueva

      - name: Cambiar nombre visible
        working-directory: finanzas_definitiva
        run: sed -i s/finanzas_definitiva/Finanzas/g android/app/src/main/AndroidManifest.xml
      
      - name: Descargar dependencias
        working-directory: finanzas_definitiva
        run: flutter pub get

      - name: Crear ícono
        working-directory: finanzas_definitiva
        run: dart run flutter_launcher_icons

      - name: Ejecutar pruebas
        working-directory: finanzas_definitiva
        run: flutter test

      - name: Compilar APK
        working-directory: finanzas_definitiva
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-Definitiva-v2-APK
          path: finanzas_definitiva/build/app/outputs/flutter-apk/app-release.apk
