name: Compilar Finanzas Definitiva v2.6.2 Oficial

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"
      - ".github/patch_finanzas_v26.py"
      - ".github/finance_v26_store.dart"
      - ".github/finance_v26_ui.dart"
      - ".github/patch_personal_wallet_v262.py"

permissions:
  contents: read

concurrency:
  group: finanzas-definitiva-oficial
  cancel-in-progress: true

env:
  FINANZAS_APPLICATION_ID: com.angel.finanzas.nueva.finanzas_definitiva
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio oficial
        uses: actions/checkout@v4

      - name: Verificar firma persistente ya configurada
        shell: bash
        run: |
          extract_secret() {
            name="$1"
            raw="$2"
            if printf '%s' "$raw" | grep -q "$name="; then
              printf '%s\n' "$raw" | sed -n "s/^.*${name}[[:space:]]*=[[:space:]]*//p" | head -n 1 | tr -d '\r'
            else
              printf '%s' "$raw" | tr -d '\r'
            fi
          }

          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

          key_b64="$(extract_secret ANDROID_KEYSTORE_BASE64 "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')"
          printf '%s' "$key_b64" | base64 --decode >/dev/null 2>&1

      - name: Descargar Finanzas Definitiva base actual
        shell: bash
        run: |
          git clone --depth 1 https://github.com/angeljo0801/Negocio.git negocio-current
          cat negocio-current/.github/archive-parts/part-* > Finanzas_Definitiva_Flutter_v3.zip
          echo "05d465ef3bfb2802934e2b68991e96bdb1e491ad3b825fe9c779805b5b6e1970  Finanzas_Definitiva_Flutter_v3.zip" | sha256sum --check
          unzip -o Finanzas_Definitiva_Flutter_v3.zip

          cp negocio-current/.github/finance_bot.dart finanzas_definitiva/lib/finance_bot.dart
          cp negocio-current/.github/finance_ai_service.dart finanzas_definitiva/lib/finance_ai_service.dart
          cp negocio-current/.github/finance_ai_settings.dart finanzas_definitiva/lib/finance_ai_settings.dart
          cp negocio-current/.github/finance_ai_chat.dart finanzas_definitiva/lib/finance_ai_chat.dart
          cp negocio-current/.github/finance_knowledge.dart finanzas_definitiva/lib/finance_knowledge.dart
          cp negocio-current/.github/finance_learning.dart finanzas_definitiva/lib/finance_learning.dart
          cp negocio-current/.github/finance_backup.dart finanzas_definitiva/lib/finance_backup.dart
          cp negocio-current/.github/finance_tool_router.dart finanzas_definitiva/lib/finance_tool_router.dart
          cp negocio-current/.github/personal_finance.dart finanzas_definitiva/lib/personal_finance.dart
          cp negocio-current/.github/paqueteria_sync.dart finanzas_definitiva/lib/paqueteria_sync.dart
          cp .github/finance_v26_store.dart finanzas_definitiva/lib/finance_v26_store.dart
          cp .github/finance_v26_ui.dart finanzas_definitiva/lib/finance_v26_ui.dart

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerar Android
        working-directory: finanzas_definitiva
        run: flutter create . --platforms=android --org com.angel.finanzas.nueva

      - name: Aplicar código actual de Finanzas Definitiva
        shell: bash
        run: |
          mkdir -p finanzas_definitiva/android/app/src/main/kotlin/com/angel/finanzas/nueva/finanzas_definitiva
          sed 's/^package com\.angel\.finanzas\.finanzas_definitiva/package com.angel.finanzas.nueva.finanzas_definitiva/'             negocio-current/.github/finance_main_activity.kt             > finanzas_definitiva/android/app/src/main/kotlin/com/angel/finanzas/nueva/finanzas_definitiva/MainActivity.kt
          sed 's/^package com\.angel\.finanzas\.finanzas_definitiva/package com.angel.finanzas.nueva.finanzas_definitiva/'             negocio-current/.github/LocalAiManagerBridge.kt             > finanzas_definitiva/android/app/src/main/kotlin/com/angel/finanzas/nueva/finanzas_definitiva/LocalAiManagerBridge.kt

          python3 negocio-current/.github/patch_finanzas.py
          python3 .github/patch_finanzas_compat_v4.py
          python3 .github/patch_finanzas_v26.py
          python3 .github/patch_personal_wallet_v262.py

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          expected = os.environ["FINANZAS_APPLICATION_ID"]
          p = Path("finanzas_definitiva/android/app/build.gradle.kts")
          s = p.read_text()
          s, n1 = re.subn(r'namespace\s*=\s*"[^"]+"', f'namespace = "{expected}"', s, count=1)
          s, n2 = re.subn(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{expected}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("No se pudo fijar la identidad Android oficial")
          p.write_text(s)

          # Remove the Flutter-created package so the only launcher activity is the official one.
          generated = Path("finanzas_definitiva/android/app/src/main/kotlin/com/angel/finanzas/nueva/finanzas_definitiva/MainActivity.kt")
          if not generated.exists():
              raise SystemExit("MainActivity oficial no existe")

          Path("finanzas_definitiva/android/FINANZAS_APPLICATION_ID.txt").write_text(expected + "\n")
          print("Application ID oficial:", expected)
          PY

      - name: Descargar dependencias
        working-directory: finanzas_definitiva
        run: flutter pub get

      - name: Analizar código
        working-directory: finanzas_definitiva
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Generar logo monetario
        working-directory: finanzas_definitiva
        run: dart run flutter_launcher_icons

      - name: Ejecutar pruebas
        working-directory: finanzas_definitiva
        run: flutter test

      - name: Compilar Finanzas Definitiva v2.6.2
        working-directory: finanzas_definitiva
        shell: bash
        run: |
          BUILD_NUMBER=$((5000 + GITHUB_RUN_NUMBER))
          echo "FINANZAS_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          flutter build apk --release --build-number "$BUILD_NUMBER"

      - name: Aplicar firma permanente de Finanzas
        working-directory: finanzas_definitiva
        shell: bash
        run: |
          extract_secret() {
            name="$1"
            raw="$2"
            if printf '%s' "$raw" | grep -q "$name="; then
              printf '%s\n' "$raw" | sed -n "s/^.*${name}[[:space:]]*=[[:space:]]*//p" | head -n 1 | tr -d '\r'
            else
              printf '%s' "$raw" | tr -d '\r'
            fi
          }

          KEYSTORE_B64="$(extract_secret ANDROID_KEYSTORE_BASE64 "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')"
          STORE_PASSWORD="$(extract_secret ANDROID_STORE_PASSWORD "$ANDROID_STORE_PASSWORD")"
          KEY_ALIAS="$(extract_secret ANDROID_KEY_ALIAS "$ANDROID_KEY_ALIAS")"
          KEY_PASSWORD="$(extract_secret ANDROID_KEY_PASSWORD "$ANDROID_KEY_PASSWORD")"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/finanzas-release.jks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks android/finanzas-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out build/app/outputs/flutter-apk/Finanzas-Definitiva-v2.6.2.apk \
            build/app/outputs/flutter-apk/app-release.apk

          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/Finanzas-Definitiva-v2.6.2.apk
          rm -f android/finanzas-release.jks

      - name: Guardar identidad final
        working-directory: finanzas_definitiva
        run: |
          {
            echo "applicationId=$FINANZAS_APPLICATION_ID"
            echo "versionName=2.6.1"
            echo "buildNumber=$FINANZAS_BUILD_NUMBER"
            echo "signing=persistent"
            echo "source=angeljo0801/Negocio"
            echo "officialRepository=angeljo0801/Finanzas-2"
          } > build/app/outputs/flutter-apk/BUILD_IDENTITY.txt

      - name: Subir Finanzas Definitiva oficial
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-Definitiva-v2.6.2-Official
          path: |
            finanzas_definitiva/build/app/outputs/flutter-apk/Finanzas-Definitiva-v2.6.2.apk
            finanzas_definitiva/build/app/outputs/flutter-apk/BUILD_IDENTITY.txt
          retention-days: 90
