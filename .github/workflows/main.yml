name: Compilar APK Finanzas Definitiva 2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir aplicación
        run: unzip -o Finanzas_Definitiva_Flutter_v2.zip

      - name: Añadir eliminación segura
        run: python3 apply_delete_support.py

      - name: Aplicar mejora de deudas y abonos parciales
        run: cp overrides/lib/database.dart overrides/lib/manager_pages.dart finanzas_definitiva/lib/

      - name: Aplicar IA flexible y mensajes copiables
        run: python3 apply_ai_flex.py

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar proyecto Android
        working-directory: finanzas_definitiva
        run: flutter create . --platforms=android --org com.angel.finanzas.nueva

      - name: Preparar Android para IA local y online
        working-directory: finanzas_definitiva
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          s=s.replace('android:label="finanzas_definitiva"','android:label="Finanzas"')
          if 'android:usesCleartextTraffic=' not in s:
              s=s.replace('<application\n        android:label=', '<application\n        android:usesCleartextTraffic="true"\n        android:label=')
          p.write_text(s)
          PY
      
      - name: Descargar dependencias
        working-directory: finanzas_definitiva
        run: flutter pub get

      - name: Crear ícono
        working-directory: finanzas_definitiva
        run: dart run flutter_launcher_icons

      - name: Ejecutar pruebas
        working-directory: finanzas_definitiva
        run: flutter test

      - name: Compilar APK
        working-directory: finanzas_definitiva
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-Definitiva-v2-APK
          path: finanzas_definitiva/build/app/outputs/flutter-apk/app-release.apk
